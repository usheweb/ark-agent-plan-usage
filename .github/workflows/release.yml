name: Release

# 推 v* 标签（如 v0.1.0）自动打包各平台安装包并上传到 Release；
# 也可以在 Actions 页面手动触发（workflow_dispatch）来试跑。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 通用包：一个 dmg 同时支持 Intel 与 M 系列芯片
          - platform: macos-latest
            label: macOS universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin

          # Windows 64 位：输出 NSIS 安装包（*_x64-setup.exe）
          - platform: windows-latest
            label: Windows x64
            rust-targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 本项目 UI 是纯静态文件（ui/），没有前端构建步骤；
      # 这里装依赖只是为了给 tauri-action 提供 @tauri-apps/cli（npm run tauri）。
      - name: Install frontend deps
        run: npm install

      # 资产名默认直接沿用产品名，而产品名是纯中文，GitHub 会把非 ASCII 字符剥掉、
      # 只剩前导下划线（如 _0.2.0_universal.dmg）。这里改成
      # 「包名(identifier)最后一段 + 版本 + 架构」命名，例如 floating_0.2.0_universal.dmg。
      - name: Resolve asset prefix
        id: asset-prefix
        shell: bash
        run: |
          prefix=$(node -p "require('./src-tauri/tauri.conf.json').identifier.split('.').pop()")
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "资产名前缀：$prefix"

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 唐三浪悬浮窗 v__VERSION__
          # 注意：tauri-action@v0 的输入名是 assetNamePattern
          # （dev 分支已改名为 releaseAssetNamePattern，升级时需同步）
          # [version] [arch] [setup] [ext] 由 action 按产物填充；[setup] 仅 nsis 安装包有值
          assetNamePattern: ${{ steps.asset-prefix.outputs.prefix }}_[version]_[arch][setup][ext]
          releaseBody: |
            唐三浪悬浮窗 v__VERSION__：把各个 AI 服务商的余额 / 用量聚合在一个悬浮窗里。

            本版更新：
            - 窗口高度按 tab 内容自适应：内容少的 tab 不再留大片底部空白，
              切换 tab 时窗口底边带 ~180ms 动画收放到贴合高度
            - 主窗口关闭按钮不再退出软件：点关闭直接收缩成悬浮窗，
              效果与「定住」按钮一致；要退出可右键悬浮卡选「退出软件」
            - 悬浮窗右键菜单文案调整为「退出悬浮窗 / 退出软件」

            支持的数据源：Trae 积分（自动读取本机 Trae CN 登录态）、火山方舟 Agent Plan、DeepSeek、Kimi 月之暗面、硅基流动。

            下载对应平台安装包即可：
            - Windows：`*_x64-setup.exe`（双击安装）
            - macOS：通用 dmg，同时支持 Intel 与 Apple 芯片

            首次启动后在界面右上角「设置」里录入各平台的密钥即可使用；
            凭证保存在本机系统钥匙串，不落明文、不会上传。启动时不会请求钥匙串授权，
            需要读取密钥时点界面上的「连接账号」按钮再授权。

            > macOS 首次打开若提示「无法验证开发者」，是因为安装包未做 Apple 公证。
            > 把 app 拖进「应用程序」后执行一次下面这条命令即可（只需一次）：
            > `xattr -dr com.apple.quarantine "/Applications/唐三浪悬浮窗.app"`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
