<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>火山方舟 AFP 用量</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>

    <header class="topbar" data-tauri-drag-region="deep">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-dot"></div>
          <div class="brand-text">
            <h1>火山方舟 AFP 用量</h1>
            <p id="subtitle">Agent Plan 套餐额度</p>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="plan-badge" id="plan-badge">—</span>
          <button class="icon-btn" id="settings-btn" title="设置火山引擎 Access Key">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path
                d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1.03z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="refresh-btn" id="refresh-btn" title="立即刷新">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span id="refresh-text">刷新</span>
          </button>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="status-bar">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">正在加载…</span>
        <span class="spacer"></span>
        <span id="countdown" class="countdown"></span>
        <button class="pin-btn" id="pin-btn" title="定住为悬浮窗，总在最前">
          <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
            <path
              d="M14 3l7 7-2.5 2.5-1.5-1.5-4 4V19l-2 2-2.5-5.5L3 13l2-2h4l4-4-1.5-1.5z"
              fill="currentColor"
            />
          </svg>
          <span>定住</span>
        </button>
      </div>

      <div id="error-banner" class="error-banner hidden"></div>

      <section id="cards" class="cards"></section>
    </main>

    <section id="float" class="float">
      <div class="float-card" data-tauri-drag-region="deep">
        <div class="float-ring">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle class="float-ring-bg" cx="26" cy="26" r="20" fill="none" stroke-width="6" />
            <circle
              id="float-ring-fg"
              class="float-ring-fg"
              cx="26"
              cy="26"
              r="20"
              fill="none"
              stroke-width="6"
              stroke="#22d3ee"
              stroke-dasharray="125.66"
              stroke-dashoffset="125.66"
            />
          </svg>
        </div>
        <div class="float-info">
          <div class="float-label">近 5 小时剩余</div>
          <div class="float-remain">
            <span id="float-remain">—</span><span class="float-unit">AFP</span>
          </div>
          <div class="float-sub" id="float-sub">正在加载…</div>
        </div>
        <button class="float-close" id="float-close" title="取消定住">×</button>
      </div>
    </section>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop" id="settings-backdrop"></div>
      <div class="modal-card">
        <div class="modal-head">
          <h2>设置火山引擎凭证</h2>
          <button class="icon-btn" id="settings-close" title="关闭">×</button>
        </div>
        <p class="modal-desc">
          仅保存在本机（<code id="creds-path">应用配置目录</code>），用于调用方舟 GetAFPUsage 接口；换机器或发布项目都不需要 <code>.env</code>。
        </p>

        <label class="field">
          <span class="field-label">Access Key</span>
          <input id="ak-input" type="text" spellcheck="false" autocomplete="off" placeholder="AKLT..." />
        </label>

        <label class="field">
          <span class="field-label">Secret Key</span>
          <span class="field-row">
            <input id="sk-input" type="password" spellcheck="false" autocomplete="off" placeholder="请填写 Secret Key" />
            <button class="ghost-btn" id="sk-toggle" type="button">显示</button>
          </span>
        </label>

        <div class="modal-link">
          <a id="key-help" href="#">打开火山引擎密钥管理页 →</a>
        </div>

        <div id="settings-msg" class="settings-msg hidden"></div>

        <div class="modal-foot">
          <button class="ghost-btn danger" id="settings-clear" type="button">清除本机凭证</button>
          <span class="spacer"></span>
          <button class="ghost-btn" id="settings-cancel" type="button">取消</button>
          <button class="ghost-btn" id="settings-test" type="button">测试连接</button>
          <button class="primary-btn" id="settings-save" type="button">保存</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
